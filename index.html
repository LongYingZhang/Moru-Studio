<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>LONGYING STUDIO</title>
<link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="shop.css">
<link rel="preload" href="assets/loader/moru-loop-poster.png" as="image">
<link rel="preload" href="assets/loader/moru-sprite.webp" as="image" type="image/webp">
<style>
html, body { margin: 0; }
html { background: #131313; }
html.is-booting, html.is-booting body { background: #000 !important; }
</style>
<script>
(function () {
  var soft = /[?&](?:enter=left|soft=1)(?:&|$)/.test(location.search);
  if (soft) document.documentElement.classList.add("is-soft-enter");
  else document.documentElement.classList.add("is-booting");
})();
</script>
</head>
<body>
<div class="boot" id="boot" aria-live="polite" aria-label="加载中">
  <div class="boot-stage">
    <div class="boot-sprite" id="bootSprite" aria-hidden="true">
      <canvas class="boot-anim" id="bootCanvas" width="220" height="220"></canvas>
    </div>
    <div class="boot-track"><div class="boot-bar" id="bootBar"></div></div>
  </div>
</div>

<header class="app-bar" id="appBar">
  <a class="logo" href="index.html"><img src="ZHANGLONGYING__STUDIO_7.svg?v=2" alt="LONGYING STUDIO"></a>
  <a class="bag-link" href="cart.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6.5 8.5h11l-.8 10.2a1.5 1.5 0 0 1-1.5 1.3H8.8a1.5 1.5 0 0 1-1.5-1.3L6.5 8.5Z" stroke="currentColor" stroke-width="1.6"/>
      <path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <span>购物袋</span>
    <span class="count" data-cart-count>00</span>
  </a>
</header>

<div class="home" id="home">
  <aside class="rail">
    <div class="topbar topbar-desktop">
      <a class="logo" href="index.html"><img src="ZHANGLONGYING__STUDIO_7.svg?v=2" alt="LONGYING STUDIO"></a>
      <a class="bag-link" href="cart.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6.5 8.5h11l-.8 10.2a1.5 1.5 0 0 1-1.5 1.3H8.8a1.5 1.5 0 0 1-1.5-1.3L6.5 8.5Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span>购物袋</span>
        <span class="count" data-cart-count>00</span>
      </a>
    </div>
    <div class="cards" id="cards"></div>
    <a class="rail-foot" href="terms.html">购物须知与隐私政策</a>
  </aside>

  <section class="hero" id="hero">
    <div class="hero-photo" id="heroPhoto"></div>
    <div class="hero-shade"></div>
    <div class="hero-center">
      <p class="hint"><span class="hint-bars" aria-hidden="true"></span>点击展开全屏画册</p>
    </div>
    <div class="hero-foot">
      <div class="hero-info">
        <h1 id="heroTitle"></h1>
        <div class="specs" id="heroSpecs"></div>
      </div>
      <button class="inspect" id="inspectBtn" type="button">检视档案 <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 9 9 3M4.5 3H9v4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>
</div>

<div class="lightbox" id="lightbox">
  <div class="lb-stage" id="lbStage">
    <button class="nav-arrow prev" id="lbPrev" type="button" aria-label="上一张">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M14.5 6 8.5 12l6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="lb-frame"><img id="lbImg" alt=""></div>
    <button class="nav-arrow next" id="lbNext" type="button" aria-label="下一张">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m9.5 6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <footer class="lb-foot">
    <div class="specs" id="lbSpecs"></div>
    <div class="thumbs" id="thumbs"></div>
    <button class="btn light lb-inspect" id="lbInspect" type="button">检视档案 →</button>
  </footer>
</div>

<div class="backdrop" id="backdrop">
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="kicker">检视档案</div>
      <h2 id="drawerTitle"></h2>
    </div>
    <div class="drawer-photo">
      <button class="drawer-nav prev" id="drawerPrev" type="button" aria-label="上一件">←</button>
      <img id="drawerImg" alt="">
      <button class="drawer-nav next" id="drawerNext" type="button" aria-label="下一件">→</button>
    </div>
    <p class="desc" id="drawerDesc" hidden></p>
    <div class="spec-card" id="drawerSpecs"></div>
    <div class="price-row">
      <span class="kicker">定价</span>
      <b id="drawerPrice"></b>
    </div>
    <div class="drawer-actions">
      <button class="btn light" id="addBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6.5 8.5h11l-.8 10.2a1.5 1.5 0 0 1-1.5 1.3H8.8a1.5 1.5 0 0 1-1.5-1.3L6.5 8.5Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        加入购物袋/订购
      </button>
      <a class="btn dark" id="detailLink" href="product.html">查看商品详情 →</a>
    </div>
  </aside>
</div>

<script src="shop.js"></script>
<script>
(function () {
  const products = Shop.products;
  const esc = Shop.escapeHtml;
  let index = 0;
  const cards = document.getElementById("cards");
  const heroPhoto = document.getElementById("heroPhoto");
  const heroTitle = document.getElementById("heroTitle");
  const heroSpecs = document.getElementById("heroSpecs");
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbSpecs = document.getElementById("lbSpecs");
  const thumbs = document.getElementById("thumbs");
  const backdrop = document.getElementById("backdrop");
  const portfolioCard = `
    <a class="card" href="https://zhanglongying.pages.dev" target="_blank" rel="noopener" style="--card:#F3F3F1" aria-label="设计师作品集">
      <span class="photo" style="background-image:url('assets/cards/06.jpg');left:0%;top:-56.3606%;width:106.4159%;height:263.7755%"></span>
      <img class="face" src="assets/cards/06-ui.svg" alt="">
      <span class="card-tag">链接</span>
    </a>`;

  if (!products.length) {
    cards.innerHTML = portfolioCard + '<div class="catalog-empty">当前没有在售商品<br><span>请稍后再来看看</span></div>';
    heroTitle.textContent = "暂无在售商品";
    heroSpecs.innerHTML = '<div class="spec"><b>状态</b><span>商品正在整理中</span></div>';
    document.querySelector(".hint").textContent = "后台上架商品后会自动显示";
    document.getElementById("hero").classList.add("is-empty");
    document.getElementById("inspectBtn").hidden = true;
    return;
  }

  function specHtml(product) {
    const rows = [];
    if (product.dimension) rows.push(["尺寸", product.dimension]);
    if (product.material) rows.push(["材质", product.material]);
    return rows.map(([k, v]) => `<div class="spec"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("");
  }

  function drawerSpecHtml(product) {
    const rows = [];
    if (product.dimension) rows.push(["尺寸", product.dimension]);
    if (product.material) rows.push(["材质", product.material]);
    if (product.weight) rows.push(["重量", product.weight]);
    return rows.map(([k, v]) => `<div class="spec-row"><em>${esc(k)}</em><span>${esc(v)}</span></div>`).join("");
  }

  function cardInk(product) {
    if (product.cardInk === "light" || product.cardInk === "dark") return product.cardInk;
    const raw = String(product.cardBg || "#f3f3f1").trim();
    const hex = raw.startsWith("#") ? raw.slice(1) : raw;
    const full = hex.length === 3 ? hex.split("").map((c) => c + c).join("") : hex;
    if (!/^[0-9a-fA-F]{6}$/.test(full)) return "dark";
    const r = parseInt(full.slice(0, 2), 16) / 255;
    const g = parseInt(full.slice(2, 4), 16) / 255;
    const b = parseInt(full.slice(4, 6), 16) / 255;
    const lin = (c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
    const lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    // 深色背景用浅色字，浅色背景用深色字
    return lum < 0.45 ? "light" : "dark";
  }

  cards.innerHTML = portfolioCard + products.map((p) => `
    <button class="card" type="button" data-id="${p.id}" data-ink="${cardInk(p)}" style="--card:${p.cardBg}" aria-label="${esc(p.no)} ${esc(p.name)} ${esc(p.nameEn)}">
      <span class="photo" style="background-image:url('${p.cardImage}');${p.cardPhoto}"></span>
      <span class="face face-live" aria-hidden="true">
        <span class="face-no">${esc(p.no)}</span>
        <span class="face-copy">
          <span class="face-name">${esc(p.name)}</span>
          <span class="face-en">${esc(p.nameEn)}</span>
        </span>
        <span class="face-go">→</span>
      </span>
    </button>`).join("");

  thumbs.innerHTML = products.map((p) => `
    <button class="thumb" type="button" data-id="${p.id}" style="background-image:url('${p.image}')" aria-label="${esc(p.name)}"></button>`).join("");

  function show(next, fade) {
    if (next < 0) next = products.length - 1;
    if (next >= products.length) next = 0;
    index = next;
    const product = products[index];
    document.querySelectorAll(".card").forEach((card) => {
      card.classList.toggle("is-on", Number(card.dataset.id) === product.id);
    });
    document.querySelectorAll(".thumb").forEach((thumb) => {
      thumb.classList.toggle("is-on", Number(thumb.dataset.id) === product.id);
    });
    const apply = () => {
      heroPhoto.style.backgroundImage = `url('${product.image}')`;
      heroPhoto.style.backgroundPosition = product.heroPosition || "center center";
      heroTitle.textContent = product.name;
      heroSpecs.innerHTML = specHtml(product);
      document.getElementById("drawerTitle").textContent = product.name;
      document.getElementById("drawerImg").src = product.image;
      document.getElementById("drawerImg").alt = product.name;
      const desc = document.getElementById("drawerDesc");
      desc.hidden = !product.desc;
      desc.textContent = product.desc || "";
      document.getElementById("drawerSpecs").innerHTML = drawerSpecHtml(product);
      document.getElementById("drawerSpecs").hidden = !drawerSpecHtml(product);
      document.getElementById("drawerPrice").textContent = Shop.formatPrice(product.price);
      document.getElementById("detailLink").href = `product.html?id=${product.id}&enter=left`;
      lbSpecs.innerHTML = specHtml(product);
    };
    if (fade) {
      heroPhoto.classList.add("is-dim");
      if (lightbox.classList.contains("open")) lbImg.classList.add("is-dim");
      setTimeout(() => {
        apply();
        heroPhoto.classList.remove("is-dim");
        lbImg.src = product.image;
        lbImg.alt = product.name;
        lbImg.classList.remove("is-dim");
      }, 150);
    } else {
      apply();
      lbImg.src = product.image;
      lbImg.alt = product.name;
    }
    const on = cards.querySelector(".is-on");
    if (on && cards.scrollHeight > cards.clientHeight) {
      const box = cards.getBoundingClientRect();
      const rect = on.getBoundingClientRect();
      const shift = rect.top < box.top ? rect.top - box.top : rect.bottom > box.bottom ? rect.bottom - box.bottom : 0;
      if (shift) cards.scrollBy({ top: shift, behavior: fade ? "smooth" : "auto" });
    }
  }

  const home = document.getElementById("home");
  const hero = document.getElementById("hero");
  const drawer = document.getElementById("drawer");
  const detailLink = document.getElementById("detailLink");

  function isPortraitFlow() {
    return window.matchMedia("(orientation: portrait)").matches && window.innerWidth <= 980;
  }

  function openHero() {
    if (!isPortraitFlow()) return;
    home.classList.add("is-hero");
    home.classList.remove("is-hero-drag");
    hero.style.transform = "";
  }

  function closeHero() {
    home.classList.remove("is-hero-drag");
    if (!home.classList.contains("is-hero")) {
      hero.style.transform = "";
      return;
    }
    // 右进左出的逆过程：滑回右侧离开
    hero.style.transform = "translateX(100%)";
    window.setTimeout(() => {
      home.classList.remove("is-hero");
      hero.style.transform = "";
    }, 320);
  }

  cards.addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (!card || !card.dataset.id) return;
    show(products.findIndex((p) => p.id === Number(card.dataset.id)), true);
    if (isPortraitFlow()) openHero();
  });

  document.getElementById("hero").addEventListener("click", (e) => {
    if (e.target.closest("#inspectBtn")) return;
    openLightbox();
  });
  document.getElementById("inspectBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    openDrawer();
  });
  document.getElementById("lbInspect").addEventListener("click", (e) => {
    e.stopPropagation();
    closeLightbox();
    openDrawer();
  });

  function openLightbox() {
    lbImg.src = products[index].image;
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeLightbox() {
    lightbox.classList.remove("open");
    document.body.style.overflow = "";
  }

  function clearDrawerSwipe() {
    backdrop.classList.remove("is-swiping");
    drawer.style.transform = "";
  }

  function openDrawer() {
    clearDrawerSwipe();
    backdrop.classList.add("open");
  }
  function closeDrawer() {
    clearDrawerSwipe();
    backdrop.classList.remove("open");
  }

  // 竖屏滑动退出：direction "right"=左→右滑离开，"left"=右→左滑离开（全屏画册 2 除外）
  function bindSwipeExit(target, options) {
    const opts = options || {};
    const toRight = opts.direction !== "left";
    let tracking = false;
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let dx = 0;
    let startAt = 0;

    function canSwipe() {
      return isPortraitFlow() && (!opts.isActive || opts.isActive());
    }

    target.addEventListener("touchstart", (e) => {
      if (!canSwipe() || e.touches.length !== 1) return;
      if (e.target.closest("button, a, input, textarea, .nav-arrow, .thumb, .drawer-nav")) return;
      const t = e.touches[0];
      tracking = true;
      dragging = false;
      startX = t.clientX;
      startY = t.clientY;
      dx = 0;
      startAt = performance.now();
    }, { passive: true });

    target.addEventListener("touchmove", (e) => {
      if (!tracking || e.touches.length !== 1) return;
      const t = e.touches[0];
      const adx = t.clientX - startX;
      const ady = t.clientY - startY;
      if (!dragging) {
        if (Math.abs(ady) > 12 && Math.abs(ady) > Math.abs(adx)) {
          tracking = false;
          return;
        }
        if (toRight ? adx < 10 : adx > -10) return;
        dragging = true;
        if (opts.onDragStart) opts.onDragStart();
      }
      dx = adx;
      if (opts.onDrag) opts.onDrag(dx);
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    function finish() {
      if (!tracking && !dragging) return;
      const width = target.offsetWidth || window.innerWidth;
      const elapsed = Math.max(1, performance.now() - startAt);
      const velocity = dx / elapsed;
      const threshold = Math.min(72, width * 0.18);
      const shouldExit = dragging && (
        toRight
          ? (dx > threshold || velocity > 0.45)
          : (dx < -threshold || velocity < -0.45)
      );
      tracking = false;
      dragging = false;
      if (shouldExit) {
        if (opts.onExit) opts.onExit();
      } else if (opts.onCancel) {
        opts.onCancel();
      }
      dx = 0;
    }

    target.addEventListener("touchend", finish);
    target.addEventListener("touchcancel", finish);
  }

  // 预览页：从右进入，手指左→右滑离开
  bindSwipeExit(hero, {
    direction: "right",
    isActive: () => home.classList.contains("is-hero") && !lightbox.classList.contains("open") && !backdrop.classList.contains("open"),
    onDragStart: () => home.classList.add("is-hero-drag"),
    onDrag: (x) => {
      const width = hero.offsetWidth || window.innerWidth;
      hero.style.transform = "translateX(" + Math.max(0, Math.min(width, x)) + "px)";
    },
    onExit: () => {
      home.classList.remove("is-hero-drag");
      closeHero();
    },
    onCancel: () => {
      home.classList.remove("is-hero-drag");
      hero.style.transform = "";
    }
  });

  // 检视档案：右→左滑退出
  bindSwipeExit(drawer, {
    direction: "left",
    isActive: () => backdrop.classList.contains("open"),
    onDragStart: () => backdrop.classList.add("is-swiping"),
    onDrag: (x) => {
      const width = drawer.offsetWidth || window.innerWidth;
      drawer.style.transform = "translateX(" + Math.max(-width, Math.min(0, x)) + "px)";
    },
    onExit: () => {
      backdrop.classList.remove("is-swiping");
      drawer.style.transform = "translateX(-100%)";
      window.setTimeout(() => closeDrawer(), 280);
    },
    onCancel: () => clearDrawerSwipe()
  });

  // 目录页：左→右滑尝试返回
  bindSwipeExit(home.querySelector(".rail"), {
    direction: "right",
    isActive: () => isPortraitFlow() && !home.classList.contains("is-hero") && !lightbox.classList.contains("open") && !backdrop.classList.contains("open"),
    onExit: () => {
      if (window.history.length > 1) history.back();
    }
  });

  document.getElementById("lbPrev").addEventListener("click", (e) => {
    e.stopPropagation();
    show(index - 1, true);
  });
  document.getElementById("lbNext").addEventListener("click", (e) => {
    e.stopPropagation();
    show(index + 1, true);
  });
  document.getElementById("drawerPrev").addEventListener("click", (e) => {
    e.stopPropagation();
    show(index - 1, true);
  });
  document.getElementById("drawerNext").addEventListener("click", (e) => {
    e.stopPropagation();
    show(index + 1, true);
  });
  document.getElementById("lbStage").addEventListener("click", (e) => {
    if (e.target.id === "lbStage") closeLightbox();
  });
  thumbs.addEventListener("click", (e) => {
    const thumb = e.target.closest(".thumb");
    if (!thumb) return;
    show(products.findIndex((p) => p.id === Number(thumb.dataset.id)), true);
  });
  backdrop.addEventListener("click", (e) => {
    if (e.target === backdrop) closeDrawer();
  });
  document.getElementById("addBtn").addEventListener("click", () => {
    Shop.addToCart(products[index].id, 1);
    closeDrawer();
    Shop.addedNotice();
  });
  detailLink.addEventListener("click", (e) => {
    e.preventDefault();
    const id = products[index].id;
    Shop.navigate("product.html?id=" + id + "&enter=left");
  });

  window.addEventListener("keydown", (e) => {
    const light = lightbox.classList.contains("open");
    if (e.key === "Escape") {
      if (light) closeLightbox();
      else if (backdrop.classList.contains("open")) closeDrawer();
      else if (home.classList.contains("is-hero")) closeHero();
      return;
    }
    if (!light && backdrop.classList.contains("open")) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
      e.preventDefault();
      show(index - 1, true);
    } else if (e.key === "ArrowRight" || e.key === "ArrowDown") {
      e.preventDefault();
      show(index + 1, true);
    }
  });

  const requested = parseInt(new URLSearchParams(location.search).get("id"), 10);
  const start = products.findIndex((p) => p.id === requested);
  show(start >= 0 ? start : 0, false);
  if (start >= 0 && isPortraitFlow() && new URLSearchParams(location.search).get("view") === "hero") {
    openHero();
  }

  window.addEventListener("load", () => {
    products.forEach((p) => { new Image().src = p.image; });
  });
})();
</script>
<div class="added-toast" id="addedToast" role="status" aria-live="polite" aria-hidden="true"></div>
</body>
</html>
