<!doctype html>
<html lang="zh-CN" class="is-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <meta
      name="description"
      content="LONGYING SHOP 商品管理后台"
    />
    <title>商品管理 · LONGYING SHOP</title>
    <link rel="icon" href="./assets/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="preload" href="../assets/loader/moru-loop-poster.png" as="image" />
    <link rel="preload" href="../assets/loader/moru-sprite.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      html, body { margin: 0; }
      html.is-booting, html.is-booting body { background: #000 !important; }
    </style>
    <script src="./card-editor.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="boot" id="boot" aria-live="polite" aria-label="加载中">
      <div class="boot-stage">
        <div class="boot-sprite" id="bootSprite" aria-hidden="true">
          <canvas class="boot-anim" id="bootCanvas" width="220" height="220"></canvas>
        </div>
        <div class="boot-track"><div class="boot-bar" id="bootBar"></div></div>
      </div>
    </div>
    <header class="site-header">
      <div class="header-inner">
        <div class="header-left">
          <a class="brand" href="#/orders" aria-label="返回订单管理">
            <span class="brand-title">后台</span>
            <span class="brand-sub">BACKEND</span>
          </a>
          <nav class="main-nav" aria-label="主要导航">
            <a href="#/orders" data-nav="orders">订单管理</a>
            <a href="#/products" data-nav="products">在售商品</a>
            <a href="#/new" data-nav="new">上新商品</a>
          </nav>
        </div>
        <div class="header-right">
          <button class="text-button" type="button" data-global-action="signout">
            退出登录
          </button>
          <button class="header-button" type="button" data-global-action="storefront">
            查看前台
          </button>
        </div>
      </div>
    </header>

    <main id="app" class="app-shell" tabindex="-1"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <noscript>
      <div class="noscript">请启用 JavaScript 后使用商品管理功能。</div>
    </noscript>
  </body>
</html>
