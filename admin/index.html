    <title>商品管理 · Studio Admin</title>
    <link rel="icon" href="./assets/favicon.png?v=8"/>
    <script>
    (function () {
      if (/[?&](?:enter=left|soft=1)(?:&|$)/.test(location.search)) return;
      // 主屏幕用系统开屏，不要再叠一层网页开屏
      if (navigator.standalone || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches) return;
      try {
        if (sessionStorage.getItem("ly-admin-splash")) return;
        sessionStorage.setItem("ly-admin-splash", "1");
      } catch (_) {}
      document.documentElement.classList.add("is-splash");
    })();
    </script>
    <style>
    html.is-splash .boot { position: fixed; inset: 0; z-index: 9999; background: #000 url("../assets/splash/desktop.webp") center / contain no-repeat; }
    @media (orientation: portrait) { html.is-splash .boot { background-image: url("../assets/splash/phone.webp"); } }
    html.is-splash .boot-stage { visibility: hidden; }
    </style>
