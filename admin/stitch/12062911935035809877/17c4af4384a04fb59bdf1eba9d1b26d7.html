<html class="dark" lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

ce-sm":"8px","gutter":"10px","space-xl":"24px","margin":"10px","space-xs":"4px"},"fontFamily":{"body-sm":["Noto Sans"],"label-caps":["Space Grotesk"],"headline-xl":["Noto Sans"],"headline-xl-mobile":["Noto Sans"],"label-mono-sm":["Space Mono"],"headline-lg":["Space Grotesk"],"label-mono":["Space Mono"],"headline-md":["Space Grotesk"],"body-md":["Noto Sans"]},"fontSize":{"body-sm":["12px",{"lineHeight":"1.5","letterSpacing":"0em","fontWeight":"400"}],"label-caps":["11px",{"lineHeight":"1","letterSpacing":"0.14em","fontWeight":"600"}],"headline-xl":["36px",{"lineHeight":"1.15","letterSpacing":"-0.02em","fontWeight":"300"}],"headline-xl-mobile":["28px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"300"}],"label-mono-sm":["14px",{"lineHeight":"1.2","letterSpacing":"0.04em","fontWeight":"400"}],"headline-lg":["24px",{"lineHeight":"1.2","letterSpacing":"0.08em","fontWeight":"500"}],"label-mono":["20px",{"lineHeight":"1.1","letterSpacing":"0.02em","fontWeight":"400"}],"headline-md":["16px",{"lineHeight":"1.3","letterSpacing":"0.06em","fontWeight":"500"}],"body-md":["14px",{"lineHeight":"1.6","letterSpacing":"0em","fontWeight":"400"}]}}}};</script></head><body class="bg-background text-on-surface font-body-md text-body-md min-h-screen antialiased select-none"><header class="fixed top-0 inset-x-0 z-50 bg-background/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between gap-space-lg"><div class="flex items-center gap-space-xl"><span class="text-primary font-body-md text-headline-md tracking-tight font-medium">物象管理</span><nav class="flex items-center gap-space-xs p-space-xs rounded-xl bg-surface-container-lowest" data-active-classes="bg-surface-container-high text-primary font-medium"><a class="px-space-md py-space-xs rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all" data-path="active-products" href="#">在售商品</a><a aria-current="page" class="px-space-md py-space-xs rounded-lg transition-all bg-surface-container-high text-primary font-medium" data-path="create-product" href="#">上架新商品</a></nav></div><div class="flex items-center gap-space-lg"><div class="flex items-center gap-space-sm px-space-md py-space-xs rounded-full bg-surface-container-lowest"><span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span><span class="font-body-sm text-body-sm text-on-surface-variant">运行中</span></div><a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" data-path="login" href="#">退出</a><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="w-full pt-16 bg-background min-h-screen"><div class="flex flex-col w-full items-center justify-start pb-space-xl">
<div class="w-full max-w-[720px] px-space-md flex flex-col gap-space-lg">
<div class="pt-space-xl pb-space-sm text-center">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight font-medium">上架新商品</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs">录入物象档案，定义纯粹形态</p>
</div>
<div class="w-full bg-surface-container-lowest rounded-xl p-space-lg flex flex-col gap-space-lg shadow-xl">
<div class="flex flex-col gap-space-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant">商品展示图</label>
<div class="relative group cursor-pointer w-full aspect-[4/3] rounded-lg bg-surface-container-low flex flex-col items-center justify-center p-space-lg transition-all hover:bg-surface-container overflow-hidden" id="drop-zone">
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-20" id="image-upload" type="file"/>
<div class="flex flex-col items-center justify-center gap-space-sm text-center" id="upload-placeholder">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[24px]">add_photo_alternate</span>
</div>
<span class="font-headline-md text-headline-md text-primary">点击添加商品图</span>
<span class="font-body-sm text-body-sm text-outline">或将图片文件拖放至此区域</span>
</div>
<img class="hidden absolute inset-0 w-full h-full object-cover z-10" data-alt="极简主义纯黑色彩艺术摆件，极度克制冷淡的摄影棚顶灯布光，深灰色无缝反光地面，纯粹几何切面设计，微弱哑光高光倒影，高端艺术策展画册质感。" id="image-preview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdkvbx2XCzuth-Y7pJsK_gx2k3_xIu389DsGmsv8oqO4u1K2FgY8cUtVmvzxfkf14LsFGx2DWCGy8Hl5JjPAL0dxc4nWZMgtmMmh40G55uSNJUyg3LknUXxkiZYY5TCLVUAkneu9uvx0TDu9h3rH4n5eN2wtWltcsycFmqLNIx5_N3b-ZP1a6e1TCYv4VqUpvJAM5jekSLbSChpnMXlTQJ9aFLqKfra0hC6w6P5yExFatGM3HxSGm2ag"/>
<button class="hidden absolute top-space-md right-space-md z-30 w-8 h-8 rounded-full bg-surface-container-lowest/80 text-primary items-center justify-center hover:bg-surface-container-lowest" id="remove-btn" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant">商品名字</label>
<input class="w-full bg-surface-container-low text-primary font-body-md text-body-md rounded-lg px-space-md py-space-sm placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" placeholder="输入商品名字" type="text"/>
</div>
<div class="flex flex-col sm:flex-row gap-space-md">
<div class="flex-1 flex flex-col gap-space-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant">商品定价</label>
<div class="relative flex items-center">
<span class="absolute left-space-md font-body-md text-body-md text-on-surface-variant pointer-events-none">¥</span>
<input class="w-full bg-surface-container-low text-primary font-body-md text-body-md rounded-lg pl-8 pr-space-md py-space-sm placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" placeholder="输入售价" step="0.01" type="number"/>
</div>
</div>
<div class="flex-1 flex flex-col gap-space-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant">商品尺寸</label>
<input class="w-full bg-surface-container-low text-primary font-body-md text-body-md rounded-lg px-space-md py-space-sm placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" placeholder="例如：90×90×120毫米" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant">商品材质</label>
<input class="w-full bg-surface-container-low text-primary font-body-md text-body-md rounded-lg px-space-md py-space-sm placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors" placeholder="例如：天然玄石岩" type="text"/>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant">商品简介</label>
<textarea class="w-full bg-surface-container-low text-primary font-body-md text-body-md rounded-lg p-space-md placeholder:text-outline focus:outline-none focus:bg-surface-container transition-colors resize-none" placeholder="输入商品简介，简明叙述设计与工艺" rows="4"></textarea>
</div>
</div>
<div class="w-full bg-surface-container-lowest rounded-xl p-space-lg flex items-center justify-between shadow-xl">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-primary font-normal">销售状态</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">发布后前台顾客可即时查看并购买</span>
</div>
<div class="flex items-center p-space-xs rounded-full bg-surface-container-low" id="status-toggle">
<button class="toggle-btn px-space-md py-space-xs rounded-full font-body-sm text-body-sm bg-primary text-on-primary font-medium transition-all shadow-sm" data-state="publish" type="button">
          直接上架
        </button>
<button class="toggle-btn px-space-md py-space-xs rounded-full font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-all" data-state="draft" type="button">
          暂存下架
        </button>
</div>
</div>
<div class="w-full flex flex-col items-center gap-space-md pt-space-xs">
<button class="w-full py-space-md rounded-full bg-primary text-on-primary font-headline-md text-headline-md font-medium tracking-wide hover:opacity-90 active:scale-[0.99] transition-all flex items-center justify-center gap-space-xs shadow-lg" type="button">
        确认并上架商品
      </button>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors py-space-xs" data-path="active-products" href="#">
        取消并返回商品列表
      </a>
</div>
</div>
</div>
<script>
  (function () {
    const input = document.getElementById('image-upload');
    const preview = document.getElementById('image-preview');
    const placeholder = document.getElementById('upload-placeholder');
    const removeBtn = document.getElementById('remove-btn');
    const toggleContainer = document.getElementById('status-toggle');

    if (input && preview && placeholder && removeBtn) {
      input.addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (evt) {
            preview.src = evt.target.result;
            preview.classList.remove('hidden');
            placeholder.classList.add('hidden');
            removeBtn.classList.remove('hidden');
            removeBtn.classList.add('flex');
          };
          reader.readAsDataURL(file);
        }
      });

      removeBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        e.preventDefault();
        input.value = '';
        preview.classList.add('hidden');
        preview.src = 'placeholder';
        placeholder.classList.remove('hidden');
        removeBtn.classList.add('hidden');
        removeBtn.classList.remove('flex');
      });
    }

    if (toggleContainer) {
      const btns = toggleContainer.querySelectorAll('.toggle-btn');
      btns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          btns.forEach(function (b) {
            b.className = 'toggle-btn px-space-md py-space-xs rounded-full font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-all';
          });
          btn.className = 'toggle-btn px-space-md py-space-xs rounded-full font-body-sm text-body-sm bg-primary text-on-primary font-medium transition-all shadow-sm';
        });
      });
    }
  })();
</script></main><footer class="w-full bg-surface-container-lowest py-space-xl"><div class="max-w-7xl mx-auto px-6 lg:px-12 flex items-center justify-between"><span class="font-body-sm text-body-sm text-on-surface-variant">物象管理系统</span><span class="font-body-sm text-body-sm text-on-surface-variant">极简中台控制台</span></div></footer></body></html>
