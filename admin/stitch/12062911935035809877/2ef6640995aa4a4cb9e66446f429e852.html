<script>
  (function() {
    const list = document.getElementById('product-list');
    const summary = document.getElementById('stat-summary');

    function updateStats() {
      const activeCount = list.querySelectorAll('[data-status="active"]').length;
      const inactiveCount = list.querySelectorAll('[data-status="inactive"]').length;
      
      const cnNums = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      const activeStr = cnNums[activeCount] || activeCount;
      const inactiveStr = cnNums[inactiveCount] || inactiveCount;
      
      summary.textContent = `在售 ${activeStr} 件 · 已下架 ${inactiveStr} 件`;
    }

    list.addEventListener('click', function(e) {
      const btn = e.target.closest('.action-toggle');
      if (!btn) return;
      
      const card = btn.closest('[data-status]');
      const tag = card.querySelector('.status-tag');
      const img = card.querySelector('img');
      const isCurrentlyActive = card.dataset.status === 'active';

      if (isCurrentlyActive) {
        card.dataset.status = 'inactive';
        card.classList.add('opacity-60');
        img.classList.add('grayscale');
        tag.textContent = '已下架';
        tag.classList.remove('text-primary');
        tag.classList.add('text-on-surface-variant');
        btn.textContent = '上架';
      } else {
        card.dataset.status = 'active';
        card.classList.remove('opacity-60');
        img.classList.remove('grayscale');
        tag.textContent = '在售';
        tag.classList.add('text-primary');
        tag.classList.remove('text-on-surface-variant');
        btn.textContent = '下架';
      }

      updateStats();
    });
  })();
