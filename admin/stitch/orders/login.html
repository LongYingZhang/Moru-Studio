<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&family=Space+Grotesk:wght@100..900&family=Space+Mono:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"secondary-container":"#464747","on-primary-fixed-variant":"#454747","primary":"#ffffff","outline-variant":"#444748","tertiary":"#ffffff","on-secondary-fixed-variant":"#464747","on-tertiary-container":"#696360","tertiary-container":"#eae1dd","surface-bright":"#393939","surface":"#131313","tertiary-fixed":"#eae1dd","on-background":"#e5e2e1","surface-container-highest":"#353534","on-tertiary":"#342f2d","surface-container-high":"#2a2a2a","on-error":"#690005","inverse-surface":"#e5e2e1","primary-container":"#e2e2e2","secondary":"#c7c6c6","on-surface":"#e5e2e1","secondary-fixed-dim":"#c7c6c6","surface-dim":"#131313","primary-fixed-dim":"#c6c6c7","surface-container-low":"#1c1b1b","primary-fixed":"#e2e2e2","surface-tint":"#c6c6c7","on-secondary":"#303031","background":"#131313","on-tertiary-fixed":"#1f1b19","error":"#ffb4ab","inverse-primary":"#5d5f5f","on-tertiary-fixed-variant":"#4b4643","on-primary":"#2f3131","on-primary-fixed":"#1a1c1c","inverse-on-surface":"#313030","secondary-fixed":"#e3e2e2","on-error-container":"#ffdad6","tertiary-fixed-dim":"#cec5c1","surface-container-lowest":"#0e0e0e","outline":"#8e9192","on-surface-variant":"#c4c7c8","on-secondary-fixed":"#1b1c1c","on-secondary-container":"#b5b5b5","surface-container":"#201f1f","surface-variant":"#353534","on-primary-container":"#636565","error-container":"#93000a"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"space-xl":"24px","space-md":"10px","margin":"10px","space-xs":"4px","gutter":"10px","space-lg":"16px","space-sm":"8px"},"fontFamily":{"body-md":["Noto Sans"],"headline-lg":["Space Grotesk"],"headline-xl":["Noto Sans"],"label-mono-sm":["Space Mono"],"label-mono":["Space Mono"],"body-sm":["Noto Sans"],"label-caps":["Space Grotesk"],"headline-xl-mobile":["Noto Sans"],"headline-md":["Space Grotesk"]},"fontSize":{"body-md":["14px",{"lineHeight":"1.6","letterSpacing":"0em","fontWeight":"400"}],"headline-lg":["24px",{"lineHeight":"1.2","letterSpacing":"0.08em","fontWeight":"500"}],"headline-xl":["36px",{"lineHeight":"1.15","letterSpacing":"-0.02em","fontWeight":"300"}],"label-mono-sm":["14px",{"lineHeight":"1.2","letterSpacing":"0.04em","fontWeight":"400"}],"label-mono":["20px",{"lineHeight":"1.1","letterSpacing":"0.02em","fontWeight":"400"}],"body-sm":["12px",{"lineHeight":"1.5","letterSpacing":"0em","fontWeight":"400"}],"label-caps":["11px",{"lineHeight":"1","letterSpacing":"0.14em","fontWeight":"600"}],"headline-xl-mobile":["28px",{"lineHeight":"1.2","letterSpacing":"-0.02em","fontWeight":"300"}],"headline-md":["16px",{"lineHeight":"1.3","letterSpacing":"0.06em","fontWeight":"500"}]}}}};</script></head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-space-md"><main class="w-full max-w-md"><div class="flex flex-col w-full">
<div class="w-full flex items-center justify-between py-space-sm mb-space-xl">
<div class="flex items-center gap-space-sm">
<span class="font-headline-lg text-headline-md tracking-wider text-primary">后台</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">CONSOLE</span>
</div>
<div class="flex items-center gap-space-xs bg-surface-container-low px-space-md py-space-xs rounded-full">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-body-sm text-body-sm text-secondary">系统已就绪</span>
</div>
</div>
<div class="w-full bg-surface-container-lowest rounded-xl p-space-xl flex flex-col gap-space-lg shadow-xl">
<div class="flex flex-col gap-space-xs">
<h1 class="font-headline-xl text-headline-xl text-primary font-normal tracking-tight">后台登录</h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
        安全验证与权限接入。没有它，谁都能改你的商品和看到顾客地址。
      </p>
</div>
<form class="flex flex-col gap-space-lg mt-space-sm" onsubmit="event.preventDefault(); handleLogin();">
<div class="flex flex-col gap-space-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="admin-account">管理员账号</label>
<div class="w-full bg-surface-container-low rounded-lg p-space-md transition-colors focus-within:bg-surface-container">
<input autocomplete="username" class="w-full bg-transparent font-body-md text-body-md text-primary placeholder:text-outline-variant outline-none" id="admin-account" placeholder="输入管理员账号" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="admin-password">登录密码</label>
<button class="font-body-sm text-body-sm text-outline hover:text-primary transition-colors cursor-pointer" id="toggle-pwd-btn" onclick="togglePasswordVisibility()" type="button">
            显示
          </button>
</div>
<div class="w-full bg-surface-container-low rounded-lg p-space-md transition-colors focus-within:bg-surface-container">
<input autocomplete="current-password" class="w-full bg-transparent font-body-md text-body-md text-primary placeholder:text-outline-variant outline-none" id="admin-password" placeholder="输入密码" required="" type="password"/>
</div>
</div>
<div class="pt-space-xs">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md rounded-full py-space-md px-space-xl flex items-center justify-center gap-space-sm hover:bg-secondary-fixed transition-all cursor-pointer group shadow-sm active:scale-[0.99]" id="submit-btn" type="submit">
<span>登录后台</span>
<span class="material-symbols-outlined text-body-md transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</form>
</div>
<div class="w-full text-center mt-space-lg">
<p class="font-body-sm text-body-sm text-outline tracking-wider">
      独立自营店铺后台安全管控 · 仅限授权终端登录
    </p>
</div>
<script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('admin-password');
      const toggleBtn = document.getElementById('toggle-pwd-btn');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        toggleBtn.textContent = '隐藏';
      } else {
        pwdInput.type = 'password';
        toggleBtn.textContent = '显示';
      }
    }

    function handleLogin() {
      const btn = document.getElementById('submit-btn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<span class="font-headline-md text-headline-md">验证凭据中...</span>';
      btn.disabled = true;
      btn.classList.add('opacity-75');

      setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
        btn.classList.remove('opacity-75');
      }, 1200);
    }
  </script>
</div></main></body></html>
