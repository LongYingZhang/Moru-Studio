# Cloudflare Pages — longying-studio
# Deploy via: bash scripts/deploy-cloudflare.sh
name = "longying-studio"
compatibility_date = "2024-11-12"
pages_build_output_dir = ".cf-stage"

[[kv_namespaces]]
binding = "TRAFFIC"
id = "60ad9ef69eae4bc48d1e625cce93737a"

# 线上订单存储（functions/api/orders.js）
[[kv_namespaces]]
binding = "MORU_ORDERS"
id = "970c2287310e4218a5eb8397dfe5f58e"

# 商品目录（functions/api/products.js）：后台保存时直接写这里，
# 改完不必重新部署就能让网页和桌面版看到。
[[kv_namespaces]]
binding = "MORU_PRODUCTS"
id = "d7ee5f23c3294993acd5d17fb535789c"
