<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moru boot preview</title>
<link rel="stylesheet" href="../../shop.css">
<style>
html, body { margin: 0; }
html.is-booting, html.is-booting body { background: #000 !important; }
.boot-sprite { background-image: url("moru-loop-poster.png"); }
</style>
<script>document.documentElement.classList.add("is-booting");</script>
</head>
<body>
<div class="boot">
  <div class="boot-stage">
    <div class="boot-sprite is-ready" id="bootSprite">
      <canvas class="boot-anim" id="bootCanvas" width="220" height="220"></canvas>
    </div>
    <div class="boot-track"><div class="boot-bar" style="transform:scaleX(.4)"></div></div>
  </div>
</div>
<script>
const FRAMES = 24, MS = 150;
const img = new Image();
img.src = "moru-sprite.webp";
img.onload = () => {
  const c = document.getElementById("bootCanvas");
  const ctx = c.getContext("2d");
  const fw = img.naturalWidth / FRAMES;
  let i = 0, last = 0;
  function draw(n) {
    ctx.drawImage(img, n * fw, 0, fw, img.naturalHeight, 0, 0, 220, 220);
  }
  draw(0);
  (function tick(ts) {
    if (!last) last = ts;
    if (ts - last >= MS) {
      last = ts;
      i = (i + 1) % FRAMES;
      draw(i);
    }
    requestAnimationFrame(tick);
  })(performance.now());
};
</script>
</body>
</html>
