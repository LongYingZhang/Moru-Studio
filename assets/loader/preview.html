<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moru boot preview</title>
<link rel="stylesheet" href="../../shop.css">
<link rel="preload" href="moru-loop.webp" as="image" type="image/webp">
<style>html,body{margin:0}html.is-booting,html.is-booting body{background:#000!important}</style>
<script>document.documentElement.classList.add("is-booting");</script>
</head>
<body>
<div class="boot" id="boot">
  <div class="boot-stage">
    <div class="boot-sprite">
      <img class="boot-anim" src="moru-loop.webp" alt="" width="220" height="220">
    </div>
    <div class="boot-track"><div class="boot-bar" id="bootBar" style="transform:scaleX(.4)"></div></div>
  </div>
</div>
</body>
</html>
