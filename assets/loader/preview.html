<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moru boot preview</title>
<link rel="stylesheet" href="../../shop.css">
<style>
html, body { margin: 0; }
html { background: #131313; }
html.is-booting, html.is-booting body { background: #000 !important; }
</style>
<script>document.documentElement.classList.add("is-booting");</script>
</head>
<body>
<div class="boot" id="boot" aria-label="加载中">
  <div class="boot-stage">
    <div class="boot-video-wrap">
      <video class="boot-video" autoplay muted loop playsinline preload="auto" poster="moru-loop-poster.png">
        <source src="moru-loop.mp4" type="video/mp4">
      </video>
    </div>
    <div class="boot-track"><div class="boot-bar" id="bootBar"></div></div>
  </div>
</div>
<script>
const bar = document.getElementById("bootBar");
let p = 0.05, dir = 1;
(function tick() {
  p += 0.003 * dir;
  if (p > 0.95) dir = -1;
  if (p < 0.05) dir = 1;
  bar.style.transform = "scaleX(" + p.toFixed(3) + ")";
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
